services:
  postgres:
    image: postgres:16-alpine
    container_name: lifelog_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lifelog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lifelog}
      POSTGRES_DB: ${POSTGRES_DB:-lifelog}
    ports:
      - "5433:5432"
    volumes:
      - lifelog_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lifelog} -d ${POSTGRES_DB:-lifelog}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lifelog_backend
    restart: on-failure
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://lifelog:lifelog@postgres:5432/lifelog}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      SESSION_ABSOLUTE_EXPIRE_MINUTES: ${SESSION_ABSOLUTE_EXPIRE_MINUTES:-43200}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
      LOGIN_FAILURE_WINDOW_SECONDS: ${LOGIN_FAILURE_WINDOW_SECONDS:-300}
      PBKDF2_ITERATIONS: ${PBKDF2_ITERATIONS:-100000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command:
      - sh
      - -c
      - |
        echo "waiting for postgres DNS…"
        i=0
        until getent hosts postgres >/dev/null 2>&1; do
          i=$$((i+1))
          if [ $$i -gt 30 ]; then
            echo "postgres hostname never resolved"
            exit 1
          fi
          sleep 1
        done
        alembic upgrade head
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lifelog_frontend
    restart: unless-stopped
    environment:
      # Same-origin `/api` via Vite proxy. Do not point at host :8000 —
      # that port is frequently another FastAPI app (405 on register).
      VITE_API_URL: ${VITE_API_URL:-}
      VITE_API_PROXY: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    # Bind-mounting ./frontend can shadow /app/node_modules on Docker Desktop
    # (especially on Windows), so run `npm install` at startup before vite.
    # It's a cheap no-op once deps are present in the anon volume.
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  lifelog_pgdata:
